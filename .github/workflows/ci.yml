name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  client-and-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm benchmark
      - run: pnpm --filter @seen/ios export:ios
      - run: pnpm --filter @seen/ios export:web
      - run: pnpm edge:bundle
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/preview-smoke/smoke.test.ts
  database-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db reset --local
      - run: pnpm exec supabase test db
      - if: always()
        run: pnpm exec supabase stop
